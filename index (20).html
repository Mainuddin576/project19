<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climbing Stairs II</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Climbing Stairs II</h1>

    <label for="n">n (number of steps)</label>
    <input id="n" type="number" min="1" value="4">

    <label for="costs">costs (comma separated, length n)</label>
    <input id="costs" type="text" value="1,2,3,4">

    <button id="solve">Find minimum cost</button>
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
